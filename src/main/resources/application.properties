# FitAura - Database & Application Configuration
# Environment variables override properties:
#   DB_URL / FITAURA_DB_URL
#   DB_USERNAME / DB_USER / FITAURA_DB_USERNAME
#   DB_PASSWORD / FITAURA_DB_PASSWORD
#   DB_MAX_POOL_SIZE / FITAURA_DB_MAX_POOL_SIZE
#   DB_MIN_IDLE / FITAURA_DB_MIN_IDLE

app.name=FitAura
app.version=1.0.0
app.phase=Production

# Database Configuration (Parameterized with secure local development defaults)
db.driver=com.mysql.cj.jdbc.Driver
db.url=${DB_URL:jdbc:mysql://localhost:3306/fitaura?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}

# HikariCP Connection Pool Defaults
db.pool.maximumPoolSize=${DB_MAX_POOL_SIZE:10}
db.pool.minimumIdle=${DB_MIN_IDLE:2}
db.pool.idleTimeout=30000
db.pool.connectionTimeout=20000
db.pool.maxLifetime=1800000
